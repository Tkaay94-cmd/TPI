- name: Get Detekt download URL
  id: detekt-url
  env:
    DETEKT_RELEASE_TAG: v1.23.8
  run: |
    gh release view "$DETEKT_RELEASE_TAG" \
      --repo detekt/detekt \
      --json assets \
      --jq '.assets[] | select(.name | endswith(".zip")) | .url' \
      > detekt_url.txt
    echo "url=$(cat detekt_url.txt)" >> "$GITHUB_OUTPUT"
